<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161826" />
  <title>Dinto Tool Register</title>

  <!-- Emoji favicon (wrench) — no asset file needed. -->
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E" />

  <!-- Inter — the one typeface the Nocturne system uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/nocturne.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- Every screen renders into here. The router picks the screen from the
       URL path and sets a data-surface on <body> ("mobile" | "admin") so the
       CSS can lay out the scan pages and the desktop admin pages differently. -->
  <div id="app" aria-live="polite"></div>

  <!-- QR generation for the label sheet (3c). Classic script so the global
       `qrcode` exists before the module entry runs. Pinned version. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- Single module entry. router.js imports config, api, ui and the screens. -->
  <script type="module" src="/js/router.js"></script>
</body>
</html>
